:root{

}

html{height:100%}body{min-height:100%}

.icon{all:unset;cursor:pointer;font-size:1.2rem;min-width:52px;height:52px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);box-sizing:border-box;padding:0 10px;background:var(--paper);font-weight:700}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:16px;background:var(--imo);color:#fff;font-weight:900;font-size:1.08rem;padding:8px 18px;text-align:center;box-shadow:0 5px 0 var(--imo2);line-height:1.35;flex-wrap:wrap}

button.sub:disabled,button.main:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:.85rem;line-height:1.7;margin:0;text-align:center}
.note a,.about a,.src a{color:var(--imo2);display:inline-flex;align-items:center;min-height:44px}
.big{font-weight:900;font-size:1.45rem;text-align:center;margin:0;line-height:1.35}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.logo .title{flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
.logo svg{width:56px;height:56px;flex:none}
.title{flex:none;font-weight:900;font-size:1.7rem;letter-spacing:.06em;text-align:center;margin:0;color:var(--ink);line-height:1.3}
.title span{color:var(--imo)}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:.95rem;line-height:1.7}
.fsrow{display:flex;gap:6px;align-items:center;justify-content:center;font-size:.85rem;color:var(--ink2);flex-wrap:wrap}

.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

.tip{background:var(--ki2);border:2px solid var(--ki);border-radius:14px;padding:.6rem .9rem;font-size:.9rem;line-height:1.7;text-align:left}
.tip b{color:var(--imo2)}
.facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.facts div{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:.8rem;color:var(--ink2);line-height:1.4}
.facts b{display:block;font-size:1.3rem;color:var(--ink)}
/* お客さんと手札 */
.guest{background:var(--paper);border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.guest .bar{display:flex;justify-content:space-between;gap:8px;padding:.35rem .8rem;background:var(--ink);color:#fff;font-size:.8rem;font-weight:700;flex-wrap:wrap}

.planner{display:flex;flex-direction:column;gap:12px}
@media (min-width:760px){.wrap.wide .planner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-areas:"hd tt" "sd tt" ". tt";align-items:start}.planner .hbox{grid-area:hd}.planner .tt{grid-area:tt}.planner .side{grid-area:sd}}
@media (max-width:759px){

}
.hand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.card .ic{font-size:1.3rem;grid-row:span 2;text-align:center}
.card b{font-weight:800}
.card small{font-size:.72rem;color:var(--ink2)}
.card[aria-pressed="true"]{border-color:var(--imo);border-width:3px;background:#f7eef3}
.card.used{border-style:dashed;background:var(--bg)}
.card.used b::before{content:"✓ ";color:var(--ok)}
.card.must b::after{content:" ★";color:var(--imo)}
.tt{display:flex;flex-direction:column;gap:4px}
.slot{display:grid;grid-template-columns:4.6rem minmax(0,1fr) 3.4rem;align-items:center;gap:6px;min-height:48px}
.slot .tm{font-weight:800;font-size:.85rem;text-align:right;line-height:1.2}
.slot .tm small{display:block;font-weight:500;font-size:.68rem;color:var(--ink2)}
.slot .cr{font-size:.68rem;color:var(--ink2);text-align:center;line-height:1.2}
.slot .cr i{display:block;height:6px;border-radius:3px;background:var(--imo);margin:2px auto 0}
.slot.night{min-height:64px}
.slot.night .cell{background:#efe9dd}
.cell{all:unset;box-sizing:border-box;min-width:0;min-height:46px;border-radius:10px;border:2px dashed var(--line);display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:.88rem;background:#fff}
button.cell{cursor:pointer}
.cell.can{border:2px solid var(--imo);background:#f7eef3;font-weight:700;color:var(--imo2)}
.cell.on{border:2px solid var(--ink);background:var(--ki2);font-weight:800}
.cell.on.c{border-left:8px solid var(--imo)}
.cell.on.o{border-left:8px solid var(--ok)}
.cell.cont{border-top:none;border-radius:0 0 10px 10px;margin-top:-6px;background:var(--ki2);border:2px solid var(--ink);border-top-width:0;min-height:42px;color:var(--ink2);font-size:.75rem}
.meters{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 3.2rem;gap:2px 8px;align-items:center;font-size:.82rem}
.meter .bar{grid-column:1/-1;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--imo)}
.meter b{text-align:right;font-size:1rem}
.meter.sum{font-weight:900;font-size:.95rem}.meter.sum .bar i{background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:.75rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend em{display:inline-block;width:14px;height:14px;border-radius:4px;font-style:normal}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.msg{min-height:1.6rem;text-align:center;font-weight:700;font-size:.95rem;margin:0}
.verdict{background:var(--paper);border:3px solid var(--imo);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #3A302B20;animation:up .35s ease-out}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:1.3rem;font-weight:900;flex-wrap:wrap}
.verdict .kou{font-size:1rem;line-height:1.75;margin:0;text-align:left;background:var(--ki2);border-radius:10px;padding:8px 12px}
.src{font-size:.78rem;color:var(--ink2);margin:0;line-height:1.4;text-align:left}
.src a{min-height:44px;padding:6px 0}
.hint{background:var(--paper);border:2px solid var(--ki);border-radius:14px;padding:.6rem .9rem;font-size:.95rem;line-height:1.7}
.stars{color:var(--gold);letter-spacing:.08em;font-size:1.2rem}
.stars .off{color:#3A302B44}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:1.3rem}
.stats small{color:var(--ink2);font-size:.75rem}
.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:1rem;line-height:1.6;text-align:center;border:2px solid var(--line)}
.shares{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.rlist .w b{display:block;font-size:.95rem}
.achnext{text-align:center;font-size:.9rem;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:.95rem;font-weight:700;color:var(--imo2);margin:0;animation:up .35s ease-out}
.badge{background:var(--imo);color:#fff;border-radius:9px;padding:1px 7px;font-size:.75rem}

.book{display:flex;flex-direction:column;gap:8px}

.book .bk small{display:block;color:var(--ink2);font-size:.78rem;line-height:1.45}
.book .no{color:var(--ink2);border-style:dashed}
.book .mk{font-size:1.3rem;text-align:center}
.book .ct{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.agrp{font-size:.85rem;color:var(--ink2);margin:4px 0 -6px;font-weight:700;letter-spacing:.1em}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:1.8rem 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:1.2rem;text-align:center}

.ach .pg{grid-area:pg;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.ach .bar{grid-area:br;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:var(--imo)}

.calnav{display:flex;align-items:center;gap:8px}.calnav b{flex:1;text-align:center;font-size:1.05rem}.calnav .sub{flex:0 0 72px}

.cal .wd{font-size:.7rem;color:var(--ink2);text-align:center}

.cal .c.miss i{color:var(--imo)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:.55rem;color:var(--imo);font-weight:900}
.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.about h3{font-size:1rem;margin:.6rem 0 .2rem;color:var(--imo2)}
.about p,.about li{font-size:.92rem;line-height:1.8;text-align:left}
.about ul{padding-left:1.2em;margin:0}
dialog#howto{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:20px;box-sizing:border-box;font-size:1rem}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:is(.icon,button,a):focus-visible{outline:3px solid var(--imo)!important;outline-offset:2px}
</style>

.a11y-dlg label{display:flex;gap:12px;align-items:center;min-height:48px;padding:6px 4px;border-top:1px solid #1d232022;cursor:pointer;line-height:1.4}
.a11y-dlg label small{display:block;font-size:13px;color:#3d4440}
.a11y-dlg input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:#1a5fd0;margin:0}
.a11y-dlg .a11y-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.a11y-dlg button,.a11y-btn,.a11y-saybtn{min-height:44px;min-width:44px;border-radius:10px;border:2px solid #1d2320;background:#fff;color:#1d2320;font:700 15px/1.2 "BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;padding:0 14px;cursor:pointer;letter-spacing:0}
.a11y-dlg button.a11y-ok{background:#1d2320;color:#fff}
.a11y-btn.a11y-float{position:fixed;left:max(8px,env(safe-area-inset-left,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:2147483000}
.a11y-btn.a11y-float[hidden]{display:none!important}
/* 「Aa」が出ているあいだは、いちばん下の物が「Aa」の下に隠れたままにならないよう下をあける（WCAG 2.4.11） */
html.a11y-floaton body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))!important}
/* 読み上げボタンが、いちばん下のボタン・リンクにかぶらないよう下をあける */
html.a11y-say body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))!important}
.a11y-saybtn{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:2147483000;box-shadow:0 2px 8px #0003}
.a11y-saybtn[hidden],.a11y-dlg [hidden]{display:none!important}
.a11y-note{font-size:13px!important}
/* 選ぶ行（文字の大きさ・音など。v9）：横に並ぶ大きなボタン。選んだものは濃く */
.a11y-dlg fieldset{border:0;border-top:1px solid #1d232022;margin:0;padding:8px 4px 10px;min-width:0}
.a11y-dlg legend{padding:6px 0 4px;float:left;width:100%;line-height:1.4}
.a11y-dlg legend small{display:block;font-size:13px;color:#3d4440}
.a11y-dlg .a11y-opts{clear:both;display:flex;gap:6px}
.a11y-dlg .a11y-opts label{flex:1;border:2px solid #1d2320;border-radius:10px;min-height:44px;padding:0 6px;justify-content:center;gap:6px;font-weight:700}
.a11y-dlg .a11y-opts label:has(input:checked){background:#1d2320;color:#fff}
.a11y-dlg .a11y-opts label:focus-within{outline:3px solid #1a5fd0;outline-offset:2px}
.a11y-dlg .a11y-opts input{width:18px;height:18px;margin:0;accent-color:#1a5fd0;flex:none}
/* 暗い画面（v10）：設定の画面と「Aa」「🔊 読む」も暗くする（白地に黒と同じ 14:1 前後） */
html.a11y-dark .a11y-dlg{background:#1c2124;color:#eceae4;border-color:#eceae4}
html.a11y-dark .a11y-dlg p,html.a11y-dark .a11y-dlg label small,html.a11y-dark .a11y-dlg legend small{color:#c3c8cb}
html.a11y-dark .a11y-dlg label,html.a11y-dark .a11y-dlg fieldset{border-top-color:#eceae433}
html.a11y-dark .a11y-dlg button,html.a11y-dark .a11y-btn,html.a11y-dark .a11y-saybtn,html.a11y-dark .a11y-dlg .a11y-opts label{background:#262c30;color:#eceae4;border-color:#eceae4}
html.a11y-dark .a11y-dlg button.a11y-ok,html.a11y-dark .a11y-dlg .a11y-opts label:has(input:checked){background:#eceae4;color:#1c2124}
html.a11y-dark :is(button,a,input,select,textarea,summary,[tabindex]):focus-visible{outline-color:#8ab4ff!important;box-shadow:0 0 0 5px #000!important}

<script id="game-store">
// 保存の読み直し（2つの写しを合わせる）の共通部品。ひな形: satou-aaaaa/shared-workflows の template/store/store.js。
// ゲームでは直さない。index.html の store:begin〜store:end の印のあいだに node scripts/sync-template.mjs <ゲームのフォルダ> で写す（ファイルを足さないので sw.js の SHELL は変えない）。
// 共通部品の版: 2（上げたら写しの版も上がる。scripts/drift-check.mjs がずれを週次まとめに出す）
//   1: とことんを終えた保存が失敗したあと、読み直しで古い回が戻る不具合が73本に広がっていた（incidents/2026-11-17-endless-revive-after-save-failure.md）。
//      load() の合わせ方を1か所に集め、直すときはここだけ直す。
//   2: 終えた回の id を s.gone に持つゲームで、新しい写しに残った終えた回が消えなかった（2026-11-18 に発見）。
//      片方が null の回が、どちらかの写しの gone（既定は gone[r.id]）にあれば、どちらの写しにあっても null にする。
// 使い方（ゲームの load()）:
//   function load() { return GameStore.load(KEY, mem, { v: 1, fresh, tidy, bank, doneOf, bookOf, objs: ["days", "runs"] }); } の形で使う
// 決まり（どのゲームでも同じ。変えるときはここと scripts/check-store.mjs を直す）:
//   - 2つの写し（localStorage と、保存に失敗したときの mem）を時刻 t で新しい n・古い o に分ける。
//   - 数は多いほう・true は残す・入れ物は両方を合わせて数は多いほう（field で変えられる）。
//   - 途中経過 runs はモードごと。片方が null（その回を終えた）なら、もう片方の回は
//     済んでいる・記録帳にある・とことん（ended）なら戻さない。終えた回の印 gone にあれば、新しい写しにあっても消す。
//   - 別の回どうしなら日付の新しいほう（同じ日は n）。古いほうは bank で記録へ入れる。
//   - 同じ回なら進み具合 prog の大きいほう（同じなら n）。join で両方の印を合わせられる。
(function (root) {
  "use strict";
  const isObj = (x) => !!x && typeof x === "object" && !Array.isArray(x);
  const VER = 2;

  // 1つの写しを読む（読めない・形がちがう・版がちがうときは null）
  function parse(text, v) {
    if (text === null || text === undefined) return null;
    let x = null;
    try { x = JSON.parse(text); } catch (e) { return null; }
    return isObj(x) && x.v === v ? x : null;
  }

  // 既定の進み具合：答えた数を重く、いまの問題のまちがい・ヒントを軽く見る
  const progOf = (r) => (r && r.res ? r.res.length : 0) * 1000 + (r && r.cur ? (r.cur.wrong || []).length * 10 + (r.cur.hints || 0) : 0);

  // 回以外の記録を合わせる
  function fields(s, n, o, opt) {
    for (const k in o) {
      if (k === "runs" || k === "t") continue;
      const x = o[k], y = n[k];
      if (opt.field) { const r = opt.field(k, x, y, s); if (r !== undefined) { s[k] = r; continue; } }
      if (Array.isArray(x) && Array.isArray(y)) s[k] = y;

        s[k] = Object.assign({}, x, y);

      else if (x === true) s[k] = true;

  }

  // 片方が null（終えた）・もう片方が途中の回のとき、その回を戻してよいか
  function revive(s, r, m, n, opt) {
    if (!r || opt.bank(s, r) || opt.doneOf(r)) return false;
    // とことんは日付の記録帳を持たない。終えた側（null）が新しければ、古い回を戻さない
    if (opt.ended(r, m) && n.runs[m] === null) return false;
    const bd = opt.bookOf(s, r.mode);
    return opt.strictBook ? !!bd && !bd[r.date] : !bd || !bd[r.date];
  }

  // 途中経過（モードごと）を合わせる
  function runs(s, a, b, n, opt) {
    const ra = isObj(a.runs) ? a.runs : {}, rb = isObj(b.runs) ? b.runs : {};
    s.runs = Object.assign({}, n.runs);
    for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) {
      const x = ra[m], y = rb[m];

      if (!x || !y) { const r = x || y; if (r && [s, a, b].some((q) => opt.gone(q, r))) s.runs[m] = null; else if (revive(s, r, m, n, opt)) s.runs[m] = r; continue; }
      if (!opt.same(x, y, m)) {
        if (opt.differ) { opt.differ(s, x, y, m, n); continue; }
        const dx = x.date || "", dy = y.date || "";
        if (dx === dy && !opt.bankTie) continue; // 同じ日の別の回は新しい写しのまま
        const [w, l] = dx > dy ? [x, y] : dx < dy ? [y, x] : n.runs[m] === x ? [x, y] : [y, x];
        opt.bank(s, l);
        s.runs[m] = w;
        continue;
      }
      const px = opt.prog(x), py = opt.prog(y), w = px > py ? x : py > px ? y : n.runs[m], l = w === x ? y : x;
      s.runs[m] = w && l && opt.join ? opt.join(w, l, m) : w;
    }
  }

  // 2つの写しを合わせる（どちらか null なら、ある方に足りない置き場を補うだけ）
  function merge(a, b, opt) {
    opt = Object.assign({
      tidy: (s) => s, objs: [], bank: () => false, doneOf: () => false, bookOf: () => null, strictBook: false,
      ended: (r) => r.mode === "e", gone: (s, r) => isObj(s.gone) && !!s.gone[r.id], same: (x, y) => x.id === y.id, prog: progOf, bankTie: false,

      const s = Object.assign(opt.fresh(), a || b || {});

    }
    a = Object.assign(opt.fresh(), a);
    b = Object.assign(opt.fresh(), b);
    const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a];
    const s = Object.assign(opt.fresh(), n);
    fields(s, n, o, opt);
    runs(s, a, b, n, opt);
    if (opt.after) opt.after(s, n, o);
    return opt.tidy(s);
  }

  // localStorage の写しと mem（保存に失敗したときの写し）を読んで合わせる
  function load(key, mem, opt) {
    let b = null;
    try { b = parse(root.localStorage.getItem(key), opt.v); } catch (e) {}
    return merge(parse(mem, opt.v), b, opt);
  }

  const api = { VER, parse, merge, load, progOf };
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.GameStore = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>

const achGot = (s) => { const t = tally(s); return ACH.filter((a) => t[a[4]] >= a[5]).map((a) => a[0]); };

// part:nextAch:begin（shared-workflows の template/parts/index/nextAch.js の写し。ここでは直さない。node scripts/sync-template.mjs で写す）
function nextAch(s) {
  const t = tally(s); let best = null;
  for (const a of ACH) { const n = t[a[4]]; if (n <= 0 || n >= a[5]) continue; const r = n / a[5], left = a[5] - n; if (!best || r > best.r || (r === best.r && left < best.left)) best = { id: a[0], name: a[1], left, unit: AUNIT[a[4]] || "", r }; }
  return best;
}

function decide() {

  if (!ok) return play();

  Depth.mark(cur.tag, m, t("who")[g.who]); // ★3に届かなかったお客さんは、次の日から「復習」にもどる

function finish() {

    first = bank(s2, run);
